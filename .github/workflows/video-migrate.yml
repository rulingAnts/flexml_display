name: video-migrate

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: run only this key (e.g. S02E05-worth-a-thousand-words)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - key: S01E11-christmas-in-papua
            src: "Dropbox/Partnership Development/Podcasts/2022/2022-11_Christmas_Episode/S1E11Christmas in Papua.mp4"
          - key: S02E02-the-heavenly-city
            src: "Dropbox/Partnership Development/Podcasts/2023/S2E2 Revelation Chapel Message/Revelation Chapel Message Episode.mp4"
          - key: S02E03-a-brief-update
            src: "Dropbox/Partnership Development/Podcasts/2023/S2E3 Wales Update/Production Video/S2E3 Wales Update.mp4"
          - key: S02E05-worth-a-thousand-words
            src: "Dropbox/Partnership Development/Podcasts/2023/S2E5 Worth a Thousand Words (Village Trip)/S2E5 Worth a Thousand Words (My Typical Day in the Village).mp4"
          - key: S02E06-highlights-reel-2023
            src: "Dropbox/Partnership Development/Podcasts/2023/S2E6 Highlights Reel 2023/Highlights Reel 2023.mp4"
          - key: S02E07-away-put-your-weapon
            src: "Dropbox/Partnership Development/Podcasts/2024/S2E7 Discourse Analysis/S2E7 Away Put Your Weapon.mp4"
          - key: S02E10-interview-with-cory-freeman
            src: "Dropbox/Partnership Development/Podcasts/2024/S2E8 Interview with Cory Freeman/S2E8 Interview with Cory Freeman.mp4"
          - key: S02E11-why-so-many-languages
            src: "Dropbox/Partnership Development/Podcasts/2024/S2E10 Why So Many Languages/S2E11 Why so many languages.mp4"

    steps:
      - name: Skip if filtered out
        id: gate
        run: |
          only='${{ github.event.inputs.only }}'
          if [ -n "$only" ] && [ "$only" != "${{ matrix.key }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install tools
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          rclone version | head -1
          df -h / /mnt | sed -n '1,6p'

      - name: Write rclone config
        if: steps.gate.outputs.run == 'true'
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          test -s ~/.config/rclone/rclone.conf
          echo "remotes: $(rclone listremotes | tr '\n' ' ')"

      - name: Fetch from Drive
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
          time rclone copyto "gdrive:${{ matrix.src }}" /mnt/work/in.mp4 \
            --multi-thread-streams 4 --retries 5 --low-level-retries 20 --stats 60s --stats-one-line
          ls -l /mnt/work/in.mp4

      - name: Probe source
        if: steps.gate.outputs.run == 'true'
        run: ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,width,height,bit_rate -of default=nw=1 /mnt/work/in.mp4

      - name: Encode to delivery MP4 (faststart)
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          time ffmpeg -y -v warning -stats -i /mnt/work/in.mp4 \
            -c:v libx264 -preset veryfast -b:v 2500k -maxrate 3000k -bufsize 6000k \
            -pix_fmt yuv420p -tag:v avc1 \
            -c:a aac -b:a 128k -ar 44100 \
            -movflags +faststart \
            /mnt/work/out.mp4
          ls -l /mnt/work/out.mp4

      - name: Verify faststart and duration
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct
          d=open('/mnt/work/out.mp4','rb').read(4_000_000)
          pos=0; order=[]
          while pos < len(d)-8 and len(order) < 6:
              sz=struct.unpack('>I', d[pos:pos+4])[0]
              order.append(d[pos+4:pos+8].decode('latin1'))
              if sz <= 1: break
              pos += sz
          print("atoms:", " -> ".join(order))
          assert 'moov' in order and 'mdat' in order and order.index('moov') < order.index('mdat'), "NOT faststart"
          print("faststart OK")
          PY
          a=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /mnt/work/in.mp4)
          b=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /mnt/work/out.mp4)
          echo "durations: in=$a out=$b"
          python3 -c "import sys;a=float('$a');b=float('$b');sys.exit(0 if abs(a-b)<2 else 1)"

      - name: Upload to R2
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          time rclone copyto /mnt/work/out.mp4 "tws:theywillsee/video/${{ matrix.key }}.mp4" \
            --s3-chunk-size 32M --s3-upload-concurrency 4 --retries 5 --stats 60s --stats-one-line
          rclone lsl "tws:theywillsee/video/${{ matrix.key }}.mp4"

      - name: Clean up
        if: always()
        run: rm -f /mnt/work/in.mp4 /mnt/work/out.mp4 ~/.config/rclone/rclone.conf
